version: "3.9"

# ── Shared environment ────────────────────────────────────────────────────────
# x- prefix = YAML extension (ignored by Docker, used for reuse via &anchors)
x-api-env: &api-env
  env_file: .env.docker

services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: tender_postgres
    environment:
      POSTGRES_USER: tender_user
      POSTGRES_PASSWORD: tender_pass
      POSTGRES_DB: tender_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tender_user -d tender_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: tender_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: tender_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama   # FIX: was missing — model survives restarts
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Application ───────────────────────────────────────────────────────────

  api:
    build:
      context: .             # build from project root
      dockerfile: Dockerfile # use our Dockerfile
    container_name: tender_api
    <<: *api-env             # inject .env.docker variables
    ports:
      - "8000:8000"
    volumes:
      # Mount data dirs so scraper output is visible on your laptop too
      - ./data:/app/data
      - ./meta_data:/app/meta_data
    depends_on:
      postgres:
        condition: service_healthy   # wait until postgres passes healthcheck
      qdrant:
        condition: service_healthy   # wait until qdrant passes healthcheck
      ollama:
        condition: service_started   # ollama has no fast healthcheck, just wait for start
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tender_frontend
    <<: *api-env
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy   # wait until API is ready before starting UI
    environment:
      # Tell Streamlit where the API lives (service name, not localhost)
      API_BASE_URL: http://api:8000

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
