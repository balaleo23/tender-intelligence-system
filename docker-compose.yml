version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: tender_postgres
    environment:
      POSTGRES_USER: tender_user
      POSTGRES_PASSWORD: tender_pass
      POSTGRES_DB: tender_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tender_user -d tender_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: tender_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: tender_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # To pull mistral after container starts: docker exec tender_ollama ollama pull mistral

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
